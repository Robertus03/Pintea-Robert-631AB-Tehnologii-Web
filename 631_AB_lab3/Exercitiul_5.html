    <script>
        
        let a = 6;
        let b = 6;
        let c = 6;

        
        if (a + b > c && a + c > b && b + c > a) {
            console.log("Cele trei laturi pot forma un triunghi.");

         
            if (a === b && b === c) {
                console.log("Triunghiul este echilateral.");
            } else if (a === b || a === c || b === c) {
                console.log("Triunghiul este isoscel.");
            } else {
                console.log("Triunghiul este oarecare.");
            }

            console.log("Cele trei laturi NU pot forma un triunghi!");
        }
